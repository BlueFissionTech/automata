name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 12 requires PHP 8.3+, so this branch validates the new test toolchain there.
        php: ["8.3"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, xml, dom, curl, tokenizer, mysqli, pdo_mysql, mongodb
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit --do-not-cache-result

      - name: Run Cortex conformance demos
        run: |
          php examples/generic/cortex/run.php
          php examples/generic/cortex/evaluate.php
          php examples/generic/cortex/adapt.php
          php examples/generic/cortex/respond.php
          php examples/generic/cortex/agent.php
          php examples/generic/cortex/promote.php
          php examples/generic/cortex/learn.php
